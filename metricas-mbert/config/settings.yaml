project:
  name: discurso-odio-sv
  seed: 42
  target_f1_macro: 0.80

# Receta recomendada plan F1 0.80 (Fases 1–3)
f1_target:
  synthetic_policy: b2_no_template_heavy
  synthetic_effective_fraction: 0.35
  platform_class_boost: default
  label_smoothing: 0.0
  loss_type: ordinal
  ordinal_weight: 0.3
  layerwise_lr_decay: 0.95
  num_train_epochs: 6
  early_stopping_patience: 3
  val_gate_min: 0.77
  learning_rates: [1.0e-5, 2.0e-5, 3.0e-5]
  sweep_seeds: [42, 7, 13, 21, 99]
  ensemble_candidates:
    - models/mbert-sv-f1
    - models/mbert-sv-b2
    - models/mbert-sv
  gates:
    min_adv75_correct: 45
    max_fpr_gap: 0.17

evaluation:
  mcnemar_alpha: 0.05

paths:
  data_processed: data/processed
  data_external: data/external
  models: models
  reports_figures: reports/figures
  reports_metrics: reports/metrics
  reports_tables: reports/tables

labels:
  num_classes: 4
  names:
    - "No Tóxico"
    - "Lenguaje Ofensivo"
    - "Discurso de Odio"
    - "Amenazas/Violencia"
  short_names:
    - no_toxico
    - ofensivo
    - odio
    - amenazas

model:
  name: bert-base-multilingual-cased
  text_column: texto_modelo
  label_column: label
  output_dir: models/mbert-sv
  label_smoothing_b2: 0.05
  threat_synthetic_effective_n: 90

# Contrato único entrenamiento / evaluación / inferencia (T-06)
inference_contract:
  max_length: 128
  text_column: texto_modelo
  normalizer: normalize_for_model
  normalizer_version: "1.1"

training:
  cpu:
    num_train_epochs: 4
    per_device_train_batch_size: 8
    per_device_eval_batch_size: 16
    learning_rate: 2.0e-5
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 2
  gpu:
    num_train_epochs: 5
    per_device_train_batch_size: 16
    per_device_eval_batch_size: 32
    learning_rate: 2.0e-5
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 3

eda:
  min_samples_per_class: 480
  high_precision_samples: 771

benchmark:
  default_datasets:
    - id: piuba-bigdata/contextualized_hate_speech
      split: test
      max_samples: 2000
      gated: false
    - id: gplsi/SocialTOX
      split: test
      max_samples: null
      gated: false
    - id: antonn-dromundo/SinOdio-LATAM-Regional-HateSpeech
      split: test
      max_samples: null
      gated: false
    - id: textdetox/multilingual_toxicity_dataset
      split: es
      max_samples: 2000
      gated: false
    - id: SINAI/ALIA-es-discriminative-hate-speech
      config: human_sample
      split: test
      max_samples: null
      gated: false
    - id: Gerard-1705/exist_dataset_es
      split: test
      max_samples: 1500
      gated: false
  gated_datasets:
    - valeriobasile/HatEval
    - SINAI/OffendES
    - CLiC-UB/DETESTS-Dis
    - dolfsai/toxic_es
    - fmplaza/EmoEvent

interpretability:
  lime_samples: 40
  shap_samples: 24
  top_k_tokens: 10
