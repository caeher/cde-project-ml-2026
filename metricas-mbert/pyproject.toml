[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discurso-odio"
version = "0.1.0"
description = "Clasificación de toxicidad y discurso de odio en español salvadoreño con mBERT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
argilla = ["argilla==2.8.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
